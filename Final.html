<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Final.css">
    <link rel="stylesheet" href="https:cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Smartcalculator</title>

</head>


<body>
    <fieldset>
        <h1>
            <i class="fa-solid fa-calculator"></i> Smart calculator
        </h1>


        <div id="calculator">
            &nbsp;&nbsp;<input id="display" placeholder="|">
            <br><br><br>
            <div id="keys">
                <button class="clear" onpointerdown="startClearPress(event)" onpointerup="endClearPress()"
                    onpointercancel="cancelClearPress()" oncontextmenu="return false">
                    C
                </button>
                <button onclick="appendToDisplay ('^')" class="power">^</button>
                <button onclick="squareroot ()" class="squareroot"> √</button>
                <button onclick="appendToDisplay ('%')" class="pourcentage">%</button>
                <button onclick="appendToDisplay ('+')" class="operator button">+</button>
                <button onclick="appendToDisplay ('7')">7</button>
                <button onclick="appendToDisplay ('8')">8</button>
                <button onclick="appendToDisplay ('9')">9</button>
                <button onclick="appendToDisplay ('-')" class="operator button">-</button>
                <button onclick="appendToDisplay ('4')">4</button>
                <button onclick="appendToDisplay ('5')">5</button>
                <button onclick="appendToDisplay ('6')">6</button>
                <button onclick="appendToDisplay ('*')" class="operator button">*</button>
                <button onclick="appendToDisplay ('1')">1</button>
                <button onclick="appendToDisplay ('2')">2</button>
                <button onclick="appendToDisplay ('3')">3</button>
                <button onclick="appendToDisplay ('/')" class="operator button">/</button>
                <button onclick="appendToDisplay ('.')">.</button>
                <button onclick="appendToDisplay ('0')">0</button>
                <button onclick="calculate ()">=</button>

            </div>


        </div>
        <script src=" Calculator.js"></script>
    </fieldset>
</body>

</html>
